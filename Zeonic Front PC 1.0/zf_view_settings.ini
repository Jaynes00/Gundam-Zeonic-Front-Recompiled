; Zeonic Front PC port: display and graphics settings (zf_view). Changed in the GRAPHICS OPTIONS menu (F10, Back + Start,
; or OPTIONS in the briefing / deployment menu), or with F6 (30 / 60 FPS), I (interpolation), F7 (draw distance), F8 (fog).
; draw_distance: 1 = Original (PS2), 2 = Extended, 4 = Enhanced, 8 = Experimental. Visual only: detection, radar,
; weapon ranges, AI and mission scripts never see it. fog_extended: 0 = the game's fog, 1 = fog distance scaled with it.
target_fps=60
interpolation=1
draw_distance=2
fog_extended=1
; aspect 4:3 (the PS2 frame) or 16:9 (a wider 3D view); render_scale 1..4 (internal resolution, 1 = 640 x 448);
; fullscreen 0 / 1 (borderless); window_size 0 = as left, 1..5 = 1024x768, 1280x720, 1920x1080, 2560x1440, 3840x2160.
aspect=16:9
render_scale=4
fullscreen=1
window_size=0
